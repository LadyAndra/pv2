<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!--
    viewport-fit=cover allows the layout to respect phone safe areas
    while still using the full available screen.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Prairie Village</title>

  <!--
    All paths are relative so the project works on GitHub Pages.
  -->
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main class="game-shell">
    <header class="game-header">
      <p class="eyebrow">Prairie Village</p>
      <h1>Birthday Build — Phase 2.2</h1>

      <p class="instructions">
        Use Arrow keys or WASD on a computer. On a phone, drag anywhere
        on the left half to move and tap anywhere on the right half to act.
      </p>
    </header>

    <section class="canvas-frame" aria-label="Prairie Village game">
      <div class="game-stage">
        <!--
          The canvas has a fixed internal resolution.

          CSS may make it appear larger or smaller, but the game itself
          always draws into this same internal pixel grid.
        -->
        <canvas
          id="game-canvas"
          width="320"
          height="240"
          aria-label="A small top-down Prairie Village map"
        >
          Your browser does not support the HTML canvas element.
        </canvas>

        <!--
          Invisible mobile controls cover the game stage.

          The left half becomes a floating joystick wherever the player
          first places a thumb.

          The right half acts as one large invisible action button.
        -->
        <div
          id="touch-controls"
          class="touch-controls"
          aria-label="Mobile game controls"
        >
          <div
            id="joystick-zone"
            class="control-zone joystick-zone"
            aria-label="Movement area"
          ></div>

          <div
            id="action-zone"
            class="control-zone action-zone"
            role="button"
            aria-label="Action"
            aria-pressed="false"
          ></div>
        </div>
      </div>
    </section>

    <footer class="game-footer">
      <p>
        Mike walks. Henry follows. The neighborhood begins here.
      </p>
    </footer>
  </main>

  <!--
    sprites.js must load first because game.js uses the sprite data
    stored inside it.
  -->
  <script src="./sprites.js"></script>
  <script src="./game.js"></script>
</body>
</html>
