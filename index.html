<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Prairie Village</title>

  <!--
    The version number forces browsers to fetch the newest CSS file.
    Increase this number whenever caching causes trouble.
  -->
  <link rel="stylesheet" href="./styles.css?v=23">
</head>

<body>
  <main class="game-shell">
    <header class="game-header">
      <p class="eyebrow">Prairie Village</p>
      <h1>Birthday Build — Phase 2.3</h1>

      <p class="instructions">
        Use Arrow keys or WASD on a computer. On a phone, drag anywhere
        on the left half to move and tap anywhere on the right half to act.
      </p>
    </header>

    <section class="canvas-frame" aria-label="Prairie Village game">
      <div class="game-stage">
        <canvas
          id="game-canvas"
          width="320"
          height="240"
          aria-label="A small top-down Prairie Village map"
        >
          Your browser does not support the HTML canvas element.
        </canvas>

        <div
          id="touch-controls"
          class="touch-controls"
          aria-label="Mobile game controls"
        >
          <div
            id="joystick-zone"
            class="control-zone joystick-zone"
            aria-label="Movement area"
          ></div>

          <div
            id="action-zone"
            class="control-zone action-zone"
            role="button"
            aria-label="Action"
            aria-pressed="false"
          ></div>
        </div>
      </div>
    </section>

    <footer class="game-footer">
      <p>
        Mike walks. Henry follows. The neighborhood begins here.
      </p>
    </footer>
  </main>

  <!--
    Version numbers force the browser to fetch the current JavaScript
    instead of reusing an older cached copy.
  -->
  <script src="./sprites.js?v=23"></script>
  <script src="./game.js?v=23"></script>
</body>
</html>
